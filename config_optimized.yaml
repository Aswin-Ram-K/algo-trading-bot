# ==========================================
# 🚀 ALGO TRADING BOT: OPTIMIZED CONFIGURATION
# ==========================================
# Generated by Backtesting Engine
# Status: READY FOR PAPER TRADING
# ==========================================

system:
  name: "Hermes Self-Improving Trade Board"
  version: "1.0"
  mode: "PAPER"  # Must be PAPER until 30 days of positive live PnL
  initial_capital: 500.00
  risk_per_trade: 0.01  # 1% of capital ($5 on $500)
  max_drawdown_limit: 0.15  # 15% max drawdown before system pause

broker:
  preferred_broker: "ALPACA"
  api_key: "YOUR_ALPACA_API_KEY"
  api_secret: "YOUR_ALPACA_API_SECRET"
  base_url: "https://paper-api.alpaca.markets"  # Paper Trading URL

data_sources:
  - name: "Yahoo Finance"
    use: "Backtesting & Historical"
  - name: "Alpaca Markets"
    use: "Live Data & Execution"
  - name: "CCXT"
    use: "Crypto Exchange Data"

# ==========================================
# 🏆 BTC MEAN REVERSION (OPTIMIZED)
# ==========================================

strategies:
  mean_reversion:
    name: "BTC Mean Reversion"
    asset: "BTC-USD"
    market: "crypto"
    active: true
    params:
      rsi_period: 7
      bb_std: 1.5
      stop_loss: 0.03   # 3% Stop Loss
      take_profit: 0.05 # 5% Take Profit
    metrics_target:
      win_rate: 0.55
      profit_factor: 1.5
      max_drawdown: 0.15

# ==========================================
# 🧠 HMM REGIME DETECTION
# ==========================================

regime:
  enabled: true
  n_states: 3
  lookback_days: 90
  confidence_threshold: 0.60
  retrain_frequency_days: 30
  features: ["log_returns", "realized_vol", "volume_ratio"]

# ==========================================
# 10 METRICS FOR SUCCESS & FAILURE
# ==========================================

metrics:
  - name: "Win Rate"
    target: "> 55%"
    action: "Above 55% is good. Below 50% needs immediate review."
  - name: "Profit Factor"
    target: "> 1.50"
    action: "For every $1 lost, we make $1.50+."
  - name: "Max Drawdown"
    target: "< 15%"
    action: "Never lose more than 15% of total capital."
  - name: "Sharpe Ratio"
    target: "> 1.00"
    action: "Are returns consistent or just lucky swings?"
  - name: "Sortino Ratio"
    target: "> 1.50"
    action: "Only penalize bad volatility, not upside spikes."
  - name: "Recovery Time"
    target: "< 30 days"
    action: "How long to get back to even after a loss?"
  - name: "Avg Trade vs Avg Loss"
    target: "Wins 1.5-2x bigger than losses"
    action: "Are our winners bigger than our losers?"
  - name: "Trade Frequency"
    target: "Active but not spammy"
    action: "Too many trades = fees eat profit."
  - name: "Market Regime Fit"
    target: "Profitable in 2/3 regimes"
    action: "Bull, bear, and choppy markets."
  - name: "Improvement Score"
    target: "Better every week"
    action: "If flat or declining, the loop is broken."

